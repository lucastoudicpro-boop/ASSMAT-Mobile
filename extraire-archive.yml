name: Extraire une archive

# Depose le zip a la racine du depot, puis lance ce workflow depuis l'onglet
# Actions. Il extrait le contenu, remplace les dossiers concernes, supprime le
# zip et commite. Pratique depuis un telephone, ou seul l'envoi d'un fichier
# unique est possible.

on:
  workflow_dispatch:
    inputs:
      archive:
        description: Nom du zip. Vide = le plus recent trouve a la racine.
        required: false
        default: ''
      garder_archive:
        description: Conserver le zip apres extraction
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  extraire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Trouver l'archive
        id: archive
        run: |
          if [ -n "${{ inputs.archive }}" ]; then
            ZIP="${{ inputs.archive }}"
          else
            ZIP=$(ls -t *.zip 2>/dev/null | head -1)
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Aucune archive trouvée. Dépose un .zip à la racine du dépôt."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Archive : $ZIP ($(du -h "$ZIP" | cut -f1))"

      - name: Extraire
        run: |
          set -e
          rm -rf /tmp/extrait && mkdir -p /tmp/extrait
          unzip -q "${{ steps.archive.outputs.zip }}" -d /tmp/extrait

          # Si tout tient dans un seul dossier racine, on l'enleve : le zip
          # contient « cocon/docs/... », le depot veut « docs/... ».
          RACINE=$(ls -A /tmp/extrait)
          if [ "$(echo "$RACINE" | wc -l)" = "1" ] && [ -d "/tmp/extrait/$RACINE" ]; then
            echo "Dossier racine « $RACINE » retiré."
            mv "/tmp/extrait/$RACINE" /tmp/contenu
          else
            mv /tmp/extrait /tmp/contenu
          fi

          # Un depot Git dans l'archive n'a rien a y faire : on le jette avant
          # meme la comparaison, pour qu'il n'apparaisse nulle part.
          if [ -e /tmp/contenu/.git ]; then
            echo "::warning::L'archive contenait un dossier .git — retiré."
            rm -rf /tmp/contenu/.git
          fi

          echo "--- contenu de l'archive ---"
          ls -A /tmp/contenu

      - name: Comparer les workflows
        id: workflows
        run: |
          # Le jeton fourni aux actions n'a pas le droit de modifier
          # .github/workflows : GitHub refuse le push. On ne peut donc pas les
          # remplacer, mais on peut dire lesquels ont change — sans quoi une
          # etape de compilation manquante passerait inapercue.
          DIFFS=""
          mkdir -p /tmp/workflows
          if [ -d /tmp/contenu/.github/workflows ]; then
            for F in /tmp/contenu/.github/workflows/*.yml; do
              [ -e "$F" ] || continue
              NOM=$(basename "$F")
              CIBLE=".github/workflows/$NOM"
              if [ ! -f "$CIBLE" ]; then
                DIFFS="$DIFFS $NOM(nouveau)"
                cp "$F" /tmp/workflows/
              elif ! cmp -s "$F" "$CIBLE"; then
                DIFFS="$DIFFS $NOM(modifié)"
                cp "$F" /tmp/workflows/
              fi
            done
          fi
          echo "diffs=$DIFFS" >> "$GITHUB_OUTPUT"
          if [ -n "$DIFFS" ]; then
            echo "::warning::Workflows à recopier à la main :$DIFFS"
          else
            echo "Aucun workflow modifié."
          fi

      - name: Déposer les workflows à recopier
        if: steps.workflows.outputs.diffs != ''
        uses: actions/upload-artifact@v4
        with:
          name: workflows-a-recopier
          path: /tmp/workflows
          if-no-files-found: ignore

      - name: Remplacer les fichiers
        id: remplacement
        run: |
          set -e
          REMPLACES=""
          IGNORES=""
          for ENTREE in $(ls -A /tmp/contenu); do
            # .github : le jeton n'a pas le droit d'y toucher, on depose a part.
            # .git : une archive ne doit jamais remplacer le depot lui-meme.
            #        Un « git init » malencontreux dans le dossier source suffit
            #        a le glisser dans le zip, et tout casse avec un code 128.
            case "$ENTREE" in
              .github|.git|.git/*)
                IGNORES="$IGNORES $ENTREE"
                continue ;;
            esac
            rm -rf "./$ENTREE"
            cp -r "/tmp/contenu/$ENTREE" "./$ENTREE"
            REMPLACES="$REMPLACES $ENTREE"
          done

          if [ -n "$IGNORES" ]; then
            echo "::warning::Ignorés (jamais remplacés) :$IGNORES"
          fi

          if [ "${{ inputs.garder_archive }}" != "true" ]; then
            rm -f "${{ steps.archive.outputs.zip }}"
          fi

          echo "remplaces=$REMPLACES" >> "$GITHUB_OUTPUT"
          echo "Remplacés :$REMPLACES"

      - name: Relever la version et le SQL
        id: infos
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo '?')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          DERNIER=$(ls -1 supabase/*.sql 2>/dev/null | grep -E '/[0-9]{3}-' | sort | tail -1)
          echo "sql=$(basename "${DERNIER:-aucun}")" >> "$GITHUB_OUTPUT"

      - name: Commiter
        id: commit
        run: |
          git config user.name "Extraction automatique"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::warning::Aucun changement : l'archive était identique au dépôt."
            echo "change=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Cocon ${{ steps.infos.outputs.version }} — extraction de ${{ steps.archive.outputs.zip }}"
          git push
          echo "change=oui" >> "$GITHUB_OUTPUT"
          echo "Commit poussé."

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Cocon ${{ steps.infos.outputs.version }}"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Archive | \`${{ steps.archive.outputs.zip }}\` |"
            echo "| Dernier fichier SQL | \`${{ steps.infos.outputs.sql }}\` |"
            echo ""
            echo "**Remplacés** :${{ steps.remplacement.outputs.remplaces }}"
            echo ""
            if [ -n "${{ steps.workflows.outputs.diffs }}" ]; then
              echo "### À recopier à la main"
              echo ""
              echo "Ces workflows ont changé dans l'archive :**${{ steps.workflows.outputs.diffs }}**"
              echo ""
              echo "Le jeton des actions n'a pas le droit de modifier \`.github/workflows\`."
              echo "Ils sont déposés en artefact **workflows-a-recopier**, en haut de cette page."
              echo ""
              echo "Sans cela, la compilation tournera avec l'ancienne version."
            else
              echo "Aucun workflow modifié : rien à recopier."
            fi
            echo ""
            echo "### Ensuite"
            echo ""
            echo "1. Exécuter \`supabase/${{ steps.infos.outputs.sql }}\` s'il n'est pas déjà passé"
            echo "2. **La compilation démarre toute seule** dès cette extraction terminée — onglet Actions."
            echo ""
            echo "> Si des workflows sont à recopier à la main (voir ci-dessus), faites-le **avant** de relancer :"
            echo "> sinon la compilation tournera avec l'ancienne version."
          } >> "$GITHUB_STEP_SUMMARY"
