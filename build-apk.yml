name: Construire les APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Cocon-Parent
            config: capacitor.config.json
            extra: android-extra
            paquet: fr/lucas/cocon/parent
            secret_firebase: GOOGLE_SERVICES_PARENT
          - nom: Cocon-Nounou
            config: capacitor.config.nounou.json
            extra: android-extra-nounou
            paquet: fr/lucas/cocon/nounou
            secret_firebase: GOOGLE_SERVICES_NOUNOU

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Localiser le projet
        id: projet
        run: |
          FICHIER=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$FICHIER" ]; then echo "::error::Aucun package.json trouvé."; exit 1; fi
          DOSSIER=$(dirname "$FICHIER")
          echo "dossier=$DOSSIER" >> "$GITHUB_OUTPUT"
          echo "Projet trouvé dans : $DOSSIER"

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Vérifier ce qui est en place
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: |
          echo "node   $(node -v)"
          echo "npm    $(npm -v)"
          echo "java   $(java -version 2>&1 | head -1)"
          echo "--- fichiers attendus ---"
          for f in package.json ${{ matrix.config }} ${{ matrix.extra }}; do
            if [ -e "$f" ]; then echo "  present  $f"
            else echo "::error::Fichier manquant : $f"; exit 1; fi
          done
          WEB=$(node -p "require('./${{ matrix.config }}').webDir")
          if [ ! -d "$WEB" ]; then echo "::error::webDir introuvable : $WEB"; exit 1; fi
          echo "  present  $WEB/ ($(ls -1 "$WEB" | wc -l) entrées)"

      - name: Installer les dépendances
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Ajouter le module de notifications
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: |
          # Un module indisponible ne doit jamais empecher de produire l'APK :
          # l'application fonctionne sans, simplement sans notifications.
          # L'appareil photo : sans lui, Android ouvre le selecteur de fichiers
          # au lieu de la camera, et aucune permission CAMERA n'apparait dans
          # les reglages du telephone.
          if npm install "@capacitor/camera@^6" --no-audit --no-fund; then
            echo "Module appareil photo installé."
          else
            echo "::error::Module appareil photo NON installé : la prise de photo ouvrira le sélecteur."
          fi
          if npm install "@capacitor/push-notifications@^6" --no-audit --no-fund; then
            echo "push=oui" >> "$GITHUB_ENV"
            echo "Module de notifications installé."
          else
            echo "push=non" >> "$GITHUB_ENV"
            echo "::warning::Module de notifications indisponible, compilation sans."
          fi

      - name: Vérifier les modules installés
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: |
          echo "--- modules Capacitor présents ---"
          node -e "
            const d = require('./package.json').dependencies || {};
            const attendus = ['@capacitor/camera','@capacitor/push-notifications','@capacitor/preferences','@capacitor/app'];
            let manque = 0;
            for (const m of attendus) {
              const ok = !!d[m];
              console.log((ok ? '  present ' : '  ABSENT  ') + m + (ok ? ' ' + d[m] : ''));
              if (!ok) manque++;
            }
            if (manque) console.log('::warning::' + manque + ' module(s) manquant(s) dans l\'APK');
          "

      - name: Choisir la configuration
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: |
          # On ecrit la configuration a l'endroit ou Capacitor la cherche,
          # plutot que de compter sur une option de ligne de commande.
          if [ "${{ matrix.config }}" != "capacitor.config.json" ]; then
            cp -f "${{ matrix.config }}" capacitor.config.json
          fi
          cat capacitor.config.json

      - name: Inscrire l'adresse du projet Supabase
        working-directory: ${{ steps.projet.outputs.dossier }}
        env:
          SUPA_URL: ${{ secrets.SUPABASE_URL }}
          SUPA_CLE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # La cle « anon » est publique par conception : elle n'ouvre rien
          # par elle-meme, ce sont les regles de la base qui protegent.
          if [ -z "$SUPA_URL" ] || [ -z "$SUPA_CLE" ]; then
            echo "Aucun secret Supabase : les champs resteront a saisir dans l'application."
            exit 0
          fi
          WEB=$(node -p "require('./capacitor.config.json').webDir")
          node - "$WEB/index.html" "$SUPA_URL" "$SUPA_CLE" <<'JS'
          const fs = require('fs');
          const [f, url, cle] = process.argv.slice(2);
          let s = fs.readFileSync(f, 'utf8');
          const avant = s;
          s = s.replace(/const PROJET = \{[\s\S]*?\};/,
            'const PROJET = {\n  url: ' + JSON.stringify(url.replace(/\/+$/, '')) +
            ',\n  cle: ' + JSON.stringify(cle) +
            ',\n  notifications: false\n};');
          if (s === avant) { console.error('::error::Bloc PROJET introuvable dans ' + f); process.exit(1); }
          fs.writeFileSync(f, s);
          console.log('Adresse du projet inscrite dans ' + f);
          JS

      - name: Générer le projet Android
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: npx --yes cap add android

      - name: Ajouter les modules natifs et les icônes
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: |
          APP=android/app/src/main/java/${{ matrix.paquet }}
          PRINT=android/app/src/main/java/android/print
          mkdir -p "$APP" "$PRINT"
          cp ${{ matrix.extra }}/*.java "$APP/" 2>/dev/null || true
          if [ -f "$APP/PdfPrint.java" ]; then mv "$APP/PdfPrint.java" "$PRINT/"; fi
          if [ -d "${{ matrix.extra }}/res" ]; then
            cp -r ${{ matrix.extra }}/res/. android/app/src/main/res/
          fi
          cat android-extra/biometrie.gradle >> android/app/build.gradle
          cat android-extra/signature.gradle >> android/app/build.gradle
          python3 android-extra/icone-notification.py "${{ matrix.config }}"
          echo "--- classes copiées ---"; ls -1 "$APP"

      - name: Brancher les notifications Firebase
        working-directory: ${{ steps.projet.outputs.dossier }}
        env:
          SERVICES_B64: ${{ secrets[matrix.secret_firebase] }}
        run: |
          if [ -z "$SERVICES_B64" ] || [ "$push" != "oui" ]; then
            echo "Compilation sans notifications."
            exit 0
          fi
          echo "$SERVICES_B64" | base64 -d > android/app/google-services.json
          node -e "require('./android/app/google-services.json')" \
            || { echo "::error::google-services.json illisible, verifie le base64"; exit 1; }

          sed -i "s|^\( *\)//\( *\)classpath 'com.google.gms:google-services|\1classpath 'com.google.gms:google-services|" android/build.gradle
          grep -q "classpath 'com.google.gms:google-services" android/build.gradle \
            || sed -i "0,/dependencies *{/s||dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle

          grep -q "com.google.gms.google-services" android/app/build.gradle \
            || echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

          # Le drapeau n'est leve qu'ici : sans lui, l'application ne demande
          # rien a Firebase, et ne peut donc pas tomber faute d'initialisation.
          WEB=$(node -p "require('./capacitor.config.json').webDir")
          sed -i "s/notifications: false/notifications: true/" "$WEB/index.html"
          grep -q "notifications: true" "$WEB/index.html" \
            || { echo "::error::Drapeau des notifications non pose"; exit 1; }
          echo "Notifications Firebase activées."

      - name: Synchroniser les fichiers web
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: npx --yes cap sync android

      - name: Préparer la signature
        id: signature
        working-directory: ${{ steps.projet.outputs.dossier }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$PWD/android/cocon.jks"
            echo "signe=oui" >> "$GITHUB_OUTPUT"
          else
            echo "signe=non" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucune clé de signature : version de débogage."
          fi

      - name: Compiler l'APK
        working-directory: ${{ steps.projet.outputs.dossier }}
        env:
          ASSMAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ASSMAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ASSMAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ steps.signature.outputs.signe }}" = "oui" ]; then
            export ASSMAT_KEYSTORE_FILE="$PWD/cocon.jks"
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../${{ matrix.nom }}.apk
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../${{ matrix.nom }}.apk
          fi

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom }}
          path: ${{ steps.projet.outputs.dossier }}/${{ matrix.nom }}.apk
          if-no-files-found: error

      - name: Ajouter à la version publiée
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ steps.projet.outputs.dossier }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --title "Cocon ${{ github.ref_name }}" \
            --notes "Cocon Parent pour l'employeur, Cocon Nounou pour l'assistante maternelle." \
            || true
          gh release upload "${{ github.ref_name }}" ${{ matrix.nom }}.apk --clobber
