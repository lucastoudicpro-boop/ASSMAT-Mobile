name: Construire l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm install

      - name: Générer le projet Android
        run: npx cap add android

      - name: Ajouter le module d'impression
        run: |
          DEST=android/app/src/main/java/fr/lucas/assmat
          mkdir -p "$DEST"
          cp android-extra/AssMatPrint.java "$DEST/"
          cp android-extra/MainActivity.java "$DEST/"
          echo "Fichiers en place :"
          ls -1 "$DEST"

      - name: Synchroniser les fichiers web
        run: npx cap sync android

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AssMat-plus
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
