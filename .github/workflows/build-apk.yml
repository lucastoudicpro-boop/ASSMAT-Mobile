name: Construire l'APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Localiser le projet
        id: projet
        run: |
          FICHIER=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$FICHIER" ]; then
            echo "Aucun package.json trouvé dans le dépôt."
            exit 1
          fi
          DOSSIER=$(dirname "$FICHIER")
          echo "dossier=$DOSSIER" >> "$GITHUB_OUTPUT"
          echo "Projet trouvé dans : $DOSSIER"

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: npm install

      - name: Générer le projet Android
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: npx cap add android

      - name: Ajouter le module d'impression
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: |
          APP=android/app/src/main/java/fr/lucas/assmat
          PRINT=android/app/src/main/java/android/print
          mkdir -p "$APP" "$PRINT"
          cp android-extra/AssMatPrint.java "$APP/"
          cp android-extra/AssMatBio.java "$APP/"
          cp android-extra/MainActivity.java "$APP/"
          cp android-extra/PdfPrint.java "$PRINT/"
          cp -r android-extra/res/. android/app/src/main/res/
          cat android-extra/biometrie.gradle >> android/app/build.gradle
          cat android-extra/signature.gradle >> android/app/build.gradle
          ls -1 "$APP" "$PRINT"

      - name: Synchroniser les fichiers web
        working-directory: ${{ steps.projet.outputs.dossier }}
        run: npx cap sync android

      - name: Préparer la signature
        id: signature
        working-directory: ${{ steps.projet.outputs.dossier }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$PWD/android/assmat.jks"
            echo "signe=oui" >> "$GITHUB_OUTPUT"
            echo "Clé de signature en place : version signée."
          else
            echo "signe=non" >> "$GITHUB_OUTPUT"
            echo "Aucune clé configurée : version de débogage."
          fi

      - name: Compiler l'APK
        working-directory: ${{ steps.projet.outputs.dossier }}
        env:
          ASSMAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ASSMAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ASSMAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ steps.signature.outputs.signe }}" = "oui" ]; then
            export ASSMAT_KEYSTORE_FILE="$PWD/assmat.jks"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../AssMat-plus.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../AssMat-plus.apk
          fi

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AssMat-plus
          path: ${{ steps.projet.outputs.dossier }}/AssMat-plus.apk
          if-no-files-found: error

      - name: Créer la version publiée
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ steps.projet.outputs.dossier }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" AssMat-plus.apk \
            --title "AssMat+ ${{ github.ref_name }}" \
            --notes "Installation : télécharger AssMat-plus.apk et l'ouvrir sur le téléphone."

